name: QNX Blueprint
description: Check a QNX 8.0 kernel trace against an architecture contract and fail the job on violations
branding:
  icon: check-circle
  color: red
inputs:
  trace:
    description: Path to a .kev file recorded with tracelogger -w
    required: true
  contract:
    description: Path to the architecture contract (YAML)
    default: blueprint.yaml
  snapshot:
    description: Optional pidin output taken when the trace stopped (default <trace>.pidin if present)
    default: ""
  explain:
    description: Explain each error with Claude (needs ANTHROPIC_API_KEY in the environment)
    default: "false"
  sources:
    description: Space-separated source files to show Claude with each finding
    default: ""
  report-dir:
    description: Where to write report.html, report.json and trace.perfetto.json
    default: blueprint-report
outputs:
  result:
    description: pass or fail
    value: ${{ steps.check.outputs.result }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install Blueprint
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        EXPLAIN: ${{ inputs.explain }}
      run: |
        python -m pip install --quiet "$ACTION_PATH"
        if [ "$EXPLAIN" = "true" ]; then python -m pip install --quiet anthropic; fi
    - name: Check trace against contract
      id: check
      shell: bash
      env:
        TRACE: ${{ inputs.trace }}
        CONTRACT: ${{ inputs.contract }}
        SNAPSHOT: ${{ inputs.snapshot }}
        EXPLAIN: ${{ inputs.explain }}
        SOURCES: ${{ inputs.sources }}
        OUT: ${{ inputs.report-dir }}
      run: |
        mkdir -p "$OUT"
        args=(check "$TRACE" --contract "$CONTRACT" --html "$OUT/report.html" --json "$OUT/report.json"
              --perfetto "$OUT/trace.perfetto.json" --markdown "$GITHUB_STEP_SUMMARY")
        [ -n "$SNAPSHOT" ] && args+=(--snapshot "$SNAPSHOT")
        if [ "$EXPLAIN" = "true" ]; then
          args+=(--explain)
          for s in $SOURCES; do args+=(--source "$s"); done
        fi
        set +e
        blueprint "${args[@]}"
        rc=$?
        set -e
        if [ $rc -eq 0 ]; then echo "result=pass" >> "$GITHUB_OUTPUT"; else echo "result=fail" >> "$GITHUB_OUTPUT"; fi
        exit $rc
