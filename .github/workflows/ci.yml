name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ".[mcp]"
      - name: Unit tests on recorded QNX traces
        run: python -m unittest discover -s tests -v
      - name: Replay every demo scenario (no QNX target, no API key)
        run: blueprint demo --out demo-out
      - uses: actions/upload-artifact@v7
        with:
          name: demo-reports
          path: demo-out
  judge-install:
    # What a judge gets: the PyPI package on a clean machine, no clone, no QNX.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install qnx-blueprint
      - run: blueprint demo --out demo-out
  action-pass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          trace: demo/cockpit/traces/camera-hang-fixed.kev
          contract: demo/cockpit/blueprint.yaml
  action-fail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: bp
        uses: ./
        continue-on-error: true
        with:
          trace: demo/cockpit/traces/deadlock.kev
          contract: demo/cockpit/blueprint.yaml
      - name: The deadlock build must fail
        run: test "${{ steps.bp.outputs.result }}" = "fail"
