name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install . 
      - name: Unit tests on recorded QNX traces
        run: python -m unittest discover -s tests -v
      - name: Replay every demo scenario (no QNX target, no API key)
        run: blueprint demo --out demo-out
      - uses: actions/upload-artifact@v4
        with:
          name: demo-reports
          path: demo-out
  action-pass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          trace: demo/cockpit/traces/camera-hang-fixed.kev
          contract: demo/cockpit/blueprint.yaml
  action-fail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: bp
        uses: ./
        continue-on-error: true
        with:
          trace: demo/cockpit/traces/deadlock.kev
          contract: demo/cockpit/blueprint.yaml
      - name: The deadlock build must fail
        run: test "${{ steps.bp.outputs.result }}" = "fail"
