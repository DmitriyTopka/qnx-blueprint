<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Blueprint: one contract, two enforcers</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="420" rx="12" fill="#ffffff"/>

  <!-- contract -->
  <rect x="330" y="24" width="240" height="70" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="450" y="54" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b4b">blueprint.yaml</text>
  <text x="450" y="78" text-anchor="middle" font-size="13" fill="#3730a3">who may talk to whom, budgets, deadlines</text>

  <!-- branch labels -->
  <text x="225" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Before release: CI</text>
  <text x="675" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">After release: the kernel</text>
  <path d="M390 94 C 330 104, 260 104, 225 110" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M510 94 C 570 104, 640 104, 675 110" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- left column -->
  <rect x="95" y="146" width="260" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="225" y="170" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">QNX 8.0 target</text>
  <text x="225" y="190" text-anchor="middle" font-size="12" fill="#334155">tracelogger -w records the kernel trace</text>
  <line x1="225" y1="202" x2="225" y2="226" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="95" y="230" width="260" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="225" y="254" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">blueprint check</text>
  <text x="225" y="274" text-anchor="middle" font-size="12" fill="#334155">every message rebuilt and checked</text>
  <line x1="225" y1="286" x2="225" y2="310" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="95" y="314" width="125" height="50" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="157" y="344" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">PASS</text>
  <rect x="230" y="314" width="125" height="50" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="292" y="336" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">FAIL, exit 1</text>
  <text x="292" y="354" text-anchor="middle" font-size="11" fill="#991b1b">report, JUnit, events</text>

  <!-- right column -->
  <rect x="545" y="146" width="260" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="675" y="170" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">blueprint secpol</text>
  <text x="675" y="190" text-anchor="middle" font-size="12" fill="#334155">writes the channel rules of a policy</text>
  <line x1="675" y1="202" x2="675" y2="226" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="545" y="230" width="260" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="675" y="254" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">secpolcompile, mkqnximage</text>
  <text x="675" y="274" text-anchor="middle" font-size="12" fill="#334155">image booted with --secpol=secure</text>
  <line x1="675" y1="286" x2="675" y2="310" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="545" y="314" width="260" height="50" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="675" y="336" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">connection outside the contract</text>
  <text x="675" y="354" text-anchor="middle" font-size="12" fill="#991b1b">Operation not permitted</text>

  <!-- Claude helper -->
  <rect x="380" y="232" width="140" height="132" rx="8" fill="#fffbeb" stroke="#d97706" stroke-dasharray="5 4"/>
  <text x="450" y="256" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">Claude helps</text>
  <text x="450" y="278" text-anchor="middle" font-size="12" fill="#78350f">--explain a finding</text>
  <text x="450" y="296" text-anchor="middle" font-size="12" fill="#78350f">init --review</text>
  <text x="450" y="314" text-anchor="middle" font-size="12" fill="#78350f">MCP server</text>
  <text x="450" y="338" text-anchor="middle" font-size="11" fill="#92400e">never the judge:</text>
  <text x="450" y="354" text-anchor="middle" font-size="11" fill="#92400e">made-up events dropped</text>

  <text x="450" y="400" text-anchor="middle" font-size="12" fill="#64748b">A denied connection is in the trace too, so CI fails it as kernel-denied.</text>
</svg>
