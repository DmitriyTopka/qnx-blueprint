[project]
name = "qnx-blueprint"
version = "0.3.1"
description = "Architecture contracts for QNX 8.0 systems, checked against kernel traces"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
explain = ["anthropic>=2.5"]
mcp = ["mcp>=2.3"]

[project.scripts]
blueprint = "blueprint.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["blueprint", "blueprint.demo"]
package-dir = {"blueprint.demo" = "demo"}

# The recorded demo traces ship inside the package, so `blueprint demo` works
# after `pip install git+https://...` too, not only from a clone.
[tool.setuptools.package-data]
"blueprint.demo" = ["cockpit/*.yaml", "cockpit/*.c", "cockpit/traces/*.kev",
                    "cockpit/traces/*.pidin", "cockpit/explanations/*.json"]
